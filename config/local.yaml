# Laptop runtime. Synthetic or fully redacted documents only.
runtime: local
region: ${AWS_REGION:-us-east-1}

store:
  kind: local
  root: ${UIF_STORE:-.uif/store}

ocr:
  kind: local            # pdfplumber for native PDFs, tesseract CLI for scans and images
  transcriber: ${UIF_TRANSCRIBER:-auto}   # auto | whisper | pocketsphinx | reference:<labels dir>

guard:
  kind: regex            # Luhn-checked PAN, SSN, bank account, email, phone
  token_salt: ${UIF_TOKEN_SALT:-local-dev-salt}

llm:
  # rules     offline deterministic baseline (no model)
  # handoff   your coding agent (Claude Code, Copilot agent mode) fills requests; see AGENT_EXTRACT.md
  # anthropic Claude Messages API, direct or via a gateway that exposes it
  # ollama    local model server
  kind: ${UIF_LLM:-rules}
  handoff:
    agent: ${UIF_AGENT_NAME:-claude-code}     # recorded on every fact's extractor_run
  anthropic:
    model: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    base_url: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
    api_key_env: ${ANTHROPIC_KEY_ENV:-ANTHROPIC_API_KEY}
    auth: ${ANTHROPIC_AUTH:-x-api-key}        # x-api-key | bearer (many gateways)
    tool_choice: auto                         # 'tool' only for older models that accept forcing
    max_tokens: 4096
  bedrock:                                  # only if this laptop has AWS credentials with Bedrock access
    model_id: ${UIF_BEDROCK_MODEL_ID:-}
    max_tokens: 4096
    tool_choice: auto
  ollama:
    host: ${OLLAMA_HOST:-http://localhost:11434}
    model: ${OLLAMA_MODEL:-hermes3:latest}
    timeout_s: 180

warehouse:
  kind: duckdb
  path: ${UIF_DUCKDB:-.uif/uif.duckdb}

registry:
  path: registry

master_data:
  path: data/merchant_master.csv

reference:
  path: data/reference        # <name>.csv -> lookup tables for schema rules and marts

thresholds:
  classify_min_confidence: 0.6
  default_review_below: 0.8
